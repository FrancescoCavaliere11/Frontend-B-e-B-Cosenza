<div class="image-row" [class.left-align]="leftAlign()" [class.right-align]="!leftAlign()">
  <div class="image-container" [style.--bg-img]="'url(' + imgUrl() + ')'">
    <img [src]="imgUrl()" [alt]="altText()">

    <div class="image-overlay">
      <h3>{{ title() }}</h3>
      <p>{{ description() }}</p>
    </div>

  </div>
</div>
