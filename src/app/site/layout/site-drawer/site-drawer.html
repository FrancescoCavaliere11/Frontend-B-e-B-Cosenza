<div class="drawer__inner" [siteFocusTrap]="layout.isDrawerOpen()">
  <nav class="drawer__nav" aria-label="Menu">
    <ul class="drawer__list">
      @for (entry of entries; track entry.key) {
        <li class="drawer__item" [style.--i]="entry.index"
            [class.drawer__item--group]="entry.kind === 'group'"
            [class.drawer__item--child]="entry.kind === 'link' && entry.inGroup"
            [class.drawer__item--closes]="entry.closesGroup">
          @if (entry.kind === 'group') {
            <span class="type-label-sm drawer__group" aria-hidden="true">{{ entry.label }}</span>
          } @else {
            <a [class]="entry.inGroup ? 'type-body-lg' : 'type-title'" [routerLink]="entry.path" (click)="layout.closeMenus()">{{ entry.label }}</a>
          }
        </li>
      }
    </ul>
  </nav>

  <div class="drawer__footer">
    <a class="type-label-sm" [href]="site.phone.href">{{ site.phone.display }}</a>
    <button type="button" class="button button--block" (click)="openBooking()">{{ ui.book }}</button>
  </div>
</div>
